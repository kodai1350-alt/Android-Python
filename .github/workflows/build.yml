name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
      - name: Install NDK and platform
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-37.0" "cmake;3.31.5"
      - name: Cache llama-server build
        uses: actions/cache@v4
        with:
          path: app/build/llama
          key: llama-${{ hashFiles('gradle.properties') }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      # Job logs need a sign-in; annotations don't, so a failure can be read from anywhere.
      - name: Name failed tests
        if: failure()
        run: python3 .github/scripts/annotate_test_failures.py app/build/test-results
      # Unit tests run on desktop Java; lint is what catches calls missing on Android 8 (minSdk 26).
      - name: Lint (API level checks)
        run: ./gradlew lintDebug --console=plain
      - name: askbot tests
        # A hang fails fast with a traceback instead of holding the runner for hours.
        timeout-minutes: 10
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "discord.py==2.7.1" pytest
          .venv/bin/python -m pytest bots/askbot -q -o faulthandler_timeout=120
      - name: Linux-only tests must have run
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          path = "app/build/test-results/testDebugUnitTest/TEST-com.pythonrunner.app.process.ManagedProcessTest.xml"
          cases = [c for c in ET.parse(path).getroot().iter("testcase") if c.get("name") == "forceKillsAfterGrace"]
          assert cases, "forceKillsAfterGrace not found"
          assert cases[0].find("skipped") is None, "forceKillsAfterGrace was skipped"
          assert cases[0].find("failure") is None, "forceKillsAfterGrace failed"
          print("forceKillsAfterGrace passed")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: PythonRunner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
