name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
      - name: Install NDK and platform
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: PythonRunner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
